@if (page(); as p) {
<div class="singular-main-block">
  <div class="wrapper">
    <div class="theme-row">
      <div id="primary" class="content-area">
        <main id="site-content" class="" role="main">
          <div class="article-wraper">
            <article id="post-{{ cssId(p) }}" class="post-{{ cssId(p) }} page type-page status-publish has-post-thumbnail hentry">
              <header class="entry-header">
                <h1 class="entry-title entry-title-large">{{ p.title }}</h1>
              </header>
              <div class="post-content-wrap">
                <div class="post-content">
                  <div class="entry-content" [innerHTML]="p.content | trustedHtml"></div>
                </div>
              </div>
            </article>
          </div>
        </main>
      </div>
    </div>
  </div>
</div>
}
