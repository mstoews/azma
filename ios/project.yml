# Generates AzmaAssociates.xcodeproj. Install XcodeGen (brew install xcodegen)
# and run `xcodegen generate` from ios/ after adding or removing files.
name: AzmaAssociates
options:
  bundleIdPrefix: com.azmaassociates
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  AzmaAssociates:
    type: application
    platform: iOS
    sources:
      - path: AzmaAssociates
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azmaassociates.mobile
        PRODUCT_MODULE_NAME: AZMA
        DEVELOPMENT_TEAM: BJMVJFPS92
        INFOPLIST_KEY_CFBundleDisplayName: AZMA
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_FILE: AzmaAssociates/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
      configs:
        # The API the app talks to. Both configurations point at the production
        # Cloud Run service; for a local server, override azma.apiBaseURL at
        # launch (see README).
        Debug:
          AZMA_API_BASE_URL: https:/$()/azma-cms-555559211982.asia-northeast1.run.app
        Release:
          AZMA_API_BASE_URL: https:/$()/azma-cms-555559211982.asia-northeast1.run.app

  AzmaAssociatesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AzmaAssociatesTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azmaassociates.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AzmaAssociates

  AzmaAssociatesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AzmaAssociatesUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azmaassociates.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AzmaAssociates

schemes:
  AzmaAssociates:
    build:
      targets:
        AzmaAssociates: all
        AzmaAssociatesTests: [test]
        AzmaAssociatesUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AzmaAssociatesTests
        - AzmaAssociatesUITests
